function compare(g,m,line,odds){if(!Number.isFinite(line)||line*2!==Math.round(line*2)||!Number.isFinite(odds)||Math.abs(odds)<100||(['over','under'].includes(m)&&line<=0))throw Error('Enter a whole/half-point line and valid American odds.');let support=(m.endsWith('spread')||m.endsWith('moneyline'))?g.margin_support:g.total_support,pmf=(m.endsWith('spread')||m.endsWith('moneyline'))?g.margin_pmf:g.total_pmf,w=0,p=0;support.forEach((x,i)=>{let r=m==='home_moneyline'?x:m==='away_moneyline'?-x:m==='home_spread'?x+line:m==='away_spread'?-x+line:m==='over'?x-line:line-x;if(r>0)w+=pmf[i];else if(r===0)p+=pmf[i]});let dec=odds>0?1+odds/100:1+100/-odds,ev=w*(dec-1)-(1-w-p);return {w,p,ev,breakeven:1/dec}}

function hrHomeLine(book){if(!book)return null;if(book.home_spread)return book.home_spread.line;if(book.away_spread)return -book.away_spread.line;return null}

function bestBook(gid,m,f){const books=gameBooks(gid);let best=null,bk=null;for(const k of Object.keys(books)){const c=books[k][m];if(!c)continue;try{const ev=compare(f,m,c.line,c.odds).ev;if(best==null||ev>best+1e-12){best=ev;bk=k}}catch{}}return bk}
function calcInputs(){const m=$('c-market').value,line=m.endsWith('moneyline')?0:Number($('c-line').value),odds=Number($('c-odds').value);if($('c-odds').value===''||(!m.endsWith('moneyline')&&$('c-line').value===''))return null;return {m,line,odds}}
function calc(gid){const out=$('c-result');const inp=calcInputs();const wasOpen=!!$('c-numbers')?.open;if(!inp){out.innerHTML='<p>Enter a line and odds, or tap a side above.</p>';return}const g=GBY[gid];const f=fc(S.version,gid)||fc(P.meta.default_version,gid);try{const books=gameBooks(gid),hr=hardRockKey(books);const r=sideModel(gid,f,inp.m,inp.line,inp.odds,hr?books[hr]:null);const e=r.screen;const fair=fairOdds(r.w,r.p);const rows=[['Value per $1',spct(r.ev)],['Chance it wins',pct0(r.w)],['Break-even win rate',pct0(r.breakeven)],['Worst case across 18 checks',e?spct(e.worst.ev):'No stress test']];if(S.version!==ENS){const s=selectionScreen(f,inp.m,inp.line,inp.odds,POLICY);rows.push(['Worst case, this model only',spct(s.worst.ev)])}rows.push(['Fair price',fair==null?'n/a':signed(Math.round(fair),0)]);const push=Math.round(r.p*100);out.innerHTML=`<div class="confrow">${conf(r.dots,'md','lg')}${flagLine(r)}</div><details id="c-numbers" class="plain"${wasOpen?' open':''}><summary>Show the numbers</summary><div class="numbers">${rows.map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}<span class="sub">Model score ${esc(team(g.away).short)} ${num(f.away_score)}, ${esc(team(g.home).short)} ${num(f.home_score)}.${push?` Push chance ${push}%.`:''} Using ${esc(vlabel(S.version))}.</span></div></details>`}catch(err){out.innerHTML=`<p>${esc(err.message)}</p>`}}

async function saveQuote(gid){try{if(!$('c-confirm').checked)throw Error('Tick the confirmation box first.');const inp=calcInputs();if(!inp)throw Error('Enter the line and odds.');if(S.version==='scenario')throw Error('Pick a saved model version to record a quote. Scenario results are not ledger forecasts.');const f=fc(S.version,gid);const ref=forecastRef(S.version,gid);if(!f||!ref)throw Error('No saved forecast for this model and game.');const obs=new Date($('c-observed').value);if(isNaN(obs))throw Error('Enter the observation time.');if(obs.getTime()>Date.now()+60000)throw Error('Observation time is in the future.');const g=GBY[gid];if(g.kickoff&&obs.getTime()>=new Date(g.kickoff).getTime())throw Error('Pregame quotes only: the observation time is after kickoff.');const bookKey=$('c-book').value;const comparison=comparisonDoc(f,inp.m,inp.line,inp.odds);const e=ensembleScreen(gid,inp.m,inp.line,inp.odds);const id=stampId('q');const doc={game_id:gid,home:g.home,away:g.away,version:S.version,forecast_seq:ref.seq,forecast_key:ref.key,forecast_issued_at:ref.issued_at,market:inp.m,line:inp.line,odds:inp.odds,book_key:bookKey,book_label:bookLabel(bookKey),observed_at:obs.toISOString(),quote_type:$('c-type').value,confirmed:true,source:'dashboard',comparison,ensemble_screen:e?{decision:e.decision,stress_min_ev:e.worst.ev,stress_max_ev:e.best.ev,american_price_at_stress_ev_floor:e.am}:null,kickoff:g.kickoff,season:P.meta.season,week:P.meta.week,payload_sha256:P.meta.payload_sha256,created_at:new Date().toISOString()};await writeDoc('quotes/'+id,doc);S.lastQuoteId=id;$('c-confirm').checked=false;$('b-line').value=inp.line;$('b-odds').value=inp.odds;$('c-savenote').textContent=S.db?'Saved to your journal.':'Saved on this device; it will sync when the journal connects.';toast(S.db?'Price saved to your journal.':'Preview mode: saved to this browser only.')}catch(err){toast(err.message,true)}}

async function writeDoc(path,doc){if(S.db){try{await S.db.doc(path).set(doc);return}catch(e){if(e&&['unavailable'].includes(e.code)){await new Promise(r=>setTimeout(r,400+Math.random()*400));await S.db.doc(path).set(doc);return}throw Error('Journal write failed ('+(e.code||'error')+'): '+(e.message||''))}}const q=store.get('nll_queue',[]);q.push({path,data:doc,queued_at:new Date().toISOString()});store.set('nll_queue',q);renderPreviewBanner()}

function weatherEffect(params,temp,wind,roof){if(roof==='dome'||roof==='closed')return 0;if(roof!=='outdoors')throw Error('Confirm roof open/outdoors or closed before applying weather.');if(!Number.isFinite(temp)||!Number.isFinite(wind)||wind<0||wind>120||temp<-60||temp>140)throw Error('Invalid Fahrenheit temperature or mph wind.');const v=[Math.max(0,wind-10)/10,Math.max(0,40-temp)/20,Math.max(0,temp-85)/15];const c=params.coefficients;const e=v[0]*c[0]+v[1]*c[1]+v[2]*c[2];return Math.max(-8,Math.min(8,e))}
const meanOf=(support,pmf)=>support.reduce((a,x,i)=>a+x*pmf[i],0);
function tilt(support,pmf,target){/* exponential tilting p'(x) ~ p(x)exp(th x), solved for the target mean; keeps the support lattice, key-number spikes and push mass */const mu=meanOf(support,pmf);if(Math.abs(mu-target)<1e-9)return pmf.slice();const at=th=>{let z=0;const out=support.map((x,i)=>{const v=pmf[i]*Math.exp(th*(x-mu));z+=v;return v});return out.map(v=>v/z)};let lo=-2,hi=2;for(let k=0;k<80;k++){const mid=(lo+hi)/2;if(meanOf(support,at(mid))<target)lo=mid;else hi=mid}return at((lo+hi)/2)}
function tiltMix(support,pmf,delta,w){const t=tilt(support,pmf,meanOf(support,pmf)+delta);return {support:support.slice(),pmf:pmf.map((p,i)=>w*t[i]+(1-w)*p)}}
function quantiles(support,pmf,qs){let c=0,i=0;const out=[];for(const q of qs){while(i<support.length&&c+pmf[i]<q){c+=pmf[i];i++}out.push(support[Math.min(i,support.length-1)])}return out}
function summarize(ms,mp,ts,tp){let mean=0,win=0,tie=0;ms.forEach((x,i)=>{mean+=x*mp[i];if(x>0)win+=mp[i];else if(x===0)tie+=mp[i]});let tmean=0;ts.forEach((x,i)=>tmean+=x*tp[i]);const m80=quantiles(ms,mp,[.1,.9]),t80=quantiles(ts,tp,[.1,.9]);return {home_spread:-mean,total:tmean,home_win:win,tie,away_win:1-win-tie,margin_80:m80,total_80:t80,home_score:(tmean+mean)/2,away_score:(tmean-mean)/2,margin_support:ms,margin_pmf:mp,total_support:ts,total_pmf:tp}}
