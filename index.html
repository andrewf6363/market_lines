'use strict';
const P=JSON.parse(document.getElementById('data').textContent);

const num=(n,d=1)=>Number(n).toFixed(d),pct=n=>num(n*100,1)+'%',signed=(n,d=1)=>(n>0?'+':'')+num(n,d),spct=n=>(n>=0?'+':'')+num(n*100,1)+'%';
const MARKETS=['home_spread','away_spread','over','under','home_moneyline','away_moneyline'];
const ENS=P.meta.ensemble_version;const POLICY=P.meta.policy;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
/* ---- expand compact PMFs once so the ported math sees its old field names ---- */
const range=([lo,hi])=>{const a=[];for(let x=lo;x<=hi;x++)a.push(x);return a};
function expand(f,gid){f.margin_support=range(f.m);f.margin_pmf=f.mp;f.total_support=range(f.t);f.total_pmf=f.tp;f.game_id=gid;if(f.components)for(const c of Object.values(f.components)){c.margin_support=range(c.m);c.margin_pmf=c.mp;c.total_support=range(c.t);c.total_pmf=c.tp}return f}
const GAMES=P.games,GBY={};for(const g of GAMES)GBY[g.game_id]=g;
for(const [v,fs] of Object.entries(P.forecasts))for(const [gid,f] of Object.entries(fs)){expand(f,gid);const g=GBY[gid];if(g){f.home_team=g.home;f.away_team=g.away}}
const VERSIONS=P.meta.versions.map(v=>v.id);
/* ---- state ---- */
const S={version:VERSIONS.includes(store.get('nll_version',''))?store.get('nll_version',''):P.meta.default_version,filter:'all',db:null,dbState:'pending',quotes:[],bets:[],scenario:null,lastQuoteId:null,unsub:[]};
/* ---- ported math (unchanged from report_v2_template.html; parity-tested vs compare.py / selection.py) ---- */
function compare(g,m,line,odds){if(!Number.isFinite(line)||line*2!==Math.round(line*2)||!Number.isFinite(odds)||Math.abs(odds)<100||(['over','under'].includes(m)&&line<=0))throw Error('Enter a whole/half-point line and valid American odds.');let support=(m.endsWith('spread')||m.endsWith('moneyline'))?g.margin_support:g.total_support,pmf=(m.endsWith('spread')||m.endsWith('moneyline'))?g.margin_pmf:g.total_pmf,w=0,p=0;support.forEach((x,i)=>{let r=m==='home_moneyline'?x:m==='away_moneyline'?-x:m==='home_spread'?x+line:m==='away_spread'?-x+line:m==='over'?x-line:line-x;if(r>0)w+=pmf[i];else if(r===0)p+=pmf[i]});let dec=odds>0?1+odds/100:1+100/-odds,ev=w*(dec-1)-(1-w-p);return {w,p,ev,breakeven:1/dec}}
function selectionScreen(g,market,line,odds,policy){let p=policy||POLICY||{paper_ev_floor:.02,stress_points:2},models=[g,...Object.values(g.components||{})],checks=[];for(let x of models){checks.push(compare(x,market,line,odds));for(let delta of [-p.stress_points,p.stress_points]){let k=market.endsWith('spread')||market.endsWith('moneyline')?'margin_support':'total_support';checks.push(compare({...x,[k]:x[k].map(v=>v+delta)},market,line,odds))}}let worst=checks.reduce((a,b)=>a.ev<b.ev?a:b),best=checks.reduce((a,b)=>a.ev>b.ev?a:b),pass=worst.ev<p.paper_ev_floor,minDec=checks.every(x=>x.w>0)?Math.max(...checks.map(x=>1+(1-x.w-x.p+p.paper_ev_floor)/x.w)):null,am=minDec==null||minDec<=1?null:minDec<2?-100/(minDec-1):100*(minDec-1);return {base:checks[0],worst,best,minDec,am,decision:pass?'Pass':'Paper candidate',floor:p.paper_ev_floor,stress:p.stress_points,components:!!g.components,n:checks.length}}
function fairOdds(w,p){let c=w/(1-p);return c<=0||c>=1?null:c>=.5?-100*c/(1-c):100*(1-c)/c}
/* ---- helpers ---- */
const fc=(v,gid)=>v==='scenario'?(S.scenario&&S.scenario.game_id===gid?S.scenario.game:null):P.forecasts[v]?.[gid];
const team=a=>P.teams[a]||{name:a,short:a,color:'#666',alt:'#999'};
function chip(a){const t=team(a),c=t.color.replace('#',''),r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16),lum=(.299*r+.587*g+.114*b)/255;return `<span class="chip" style="--c:${esc(t.color)};--a:${esc(t.alt)};--fg:${lum>.62?'#111':'#fff'}">${esc(a)}</span>`}
const when=iso=>iso?new Date(iso).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'TBD';
const whenShort=iso=>iso?new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'n/a';
const bookLabel=k=>P.meta.book_labels[k]||(P.odds.games&&Object.values(P.odds.games).map(g=>g.books?.[k]?.title).find(Boolean))||k;
const gameBooks=gid=>(P.odds.games?.[gid]?.books)||{};
const hardRockKey=books=>P.meta.primary_book.find(k=>books[k]);
const orderedBooks=books=>{const hr=P.meta.primary_book.find(k=>books[k]);return [...P.meta.book_order.filter(k=>books[k]&&(!P.meta.primary_book.includes(k)||k===hr)),...Object.keys(books).filter(k=>!P.meta.book_order.includes(k))]};
const FAMILIES=[['Spread',['home_spread','away_spread']],['Total',['over','under']],['Moneyline',['home_moneyline','away_moneyline']]];
function marketText(g,m,line){if(m==='home_spread')return g.home+' '+signed(line);if(m==='away_spread')return g.away+' '+signed(line);if(m==='over')return 'Over '+num(line);if(m==='under')return 'Under '+num(line);if(m==='home_moneyline')return g.home+' to win';return g.away+' to win'}
const mlabel={home_spread:'Home spread',away_spread:'Away spread',over:'Over',under:'Under',home_moneyline:'Home team to win (moneyline)',away_moneyline:'Away team to win (moneyline)'};
function bestIn(book,allowed,f){let best=null;for(const m of allowed){const c=book[m];if(!c)continue;try{const x=compare(f,m,c.line,c.odds);if(!best||x.ev>best.ev)best={market:m,line:c.line,odds:c.odds,...x,override:!!c.override}}catch{}}return best}
function ensembleScreen(gid,m,line,odds){const e=ENS&&P.forecasts[ENS]?.[gid];if(!e)return null;try{return selectionScreen(e,m,line,odds,POLICY)}catch{return null}}

const nowLocal=()=>{const n=new Date();return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,16)};
const stampId=(p)=>{const d=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');let r='';for(let i=0;i<4;i++)r+=Math.floor(Math.random()*36).toString(36);return p+'_'+d+'_'+r};

const CAUTION_TEXT='The model and the market disagree by more than 5 points here. In past seasons the market was usually closer than the model in games like this, so treat the value as a flag to investigate, not an edge.';
function cardModel(gid){const f=fc(S.version,gid)||fc(P.meta.default_version,gid);const books=gameBooks(gid),hr=hardRockKey(books),primary=hr||orderedBooks(books)[0]||null;const rows=[];for(const [fam,allowed] of FAMILIES){const b=primary?bestIn(books[primary],allowed,f):null;if(!b)continue;const screen=ensembleScreen(gid,b.market,b.line,b.odds);const gap=fam==='Spread'?Math.abs(f.home_spread-(b.market==='home_spread'?b.line:-b.line)):fam==='Total'?Math.abs(f.total-b.line):null;const caution=gap!=null&&gap>5;let elsewhere=null;for(const k of orderedBooks(books)){if(k===primary)continue;const o=bestIn(books[k],allowed,f);if(o&&o.ev>b.ev+1e-12&&(!elsewhere||o.ev>elsewhere.ev))elsewhere={...o,book:k}}rows.push({fam,...b,screen,elsewhere,gap,caution})}const sp=rows.find(r=>r.fam==='Spread');for(const r of rows)if(r.fam==='Moneyline'&&sp){r.gap=sp.gap;r.caution=sp.caution}return {f,books,hr,primary,rows,caution:rows.some(r=>r.caution)}}
function renderSlate(){const today=new Date().toDateString();const models={};for(const g of GAMES)models[g.game_id]=cardModel(g.game_id);const list=GAMES.filter(g=>{const m=models[g.game_id];if(S.filter==='cand')return m.rows.some(r=>r.screen&&r.screen.decision==='Paper candidate');if(S.filter==='pos')return m.rows.some(r=>r.ev>0);if(S.filter==='today')return g.kickoff&&new Date(g.kickoff).toDateString()===today;if(S.filter==='nocaution')return !m.caution;return true});const o=P.odds;const srcNote=o.status==='available'?`Prices: ${esc(o.source_label||'The Odds API')} snapshot ${esc(when(o.retrieved_at))}${o.credits_remaining!=null?' \u00B7 '+esc(o.credits_remaining)+' credits left':''}. Hard Rock Bet is shown first; another book appears only when its price beats Hard Rock's.`:o.status==='fallback'?`No Odds API snapshot yet, so showing ${esc(o.source_label||'ESPN')} lines retrieved ${esc(when(o.retrieved_at))} so there is something to compare. Hard Rock prices will replace these on the next pull.`:o.status==='overrides_only'?'Only manually entered lines are loaded. Run the odds pull for book prices.':'No sportsbook prices in this build. Open a game and enter a line to check value.';$('view').innerHTML=`<section class="hero"><h1>Week ${esc(P.meta.week)}.</h1><p class="sub">${GAMES.length===16?'Sixteen':GAMES.length} games. The model's numbers next to Hard Rock Bet's prices.</p><p class="meta caption" id="stamp">${S.stamp||''}</p></section><div class="filters" role="tablist"><div class="seg">${[['all','All games'],['cand','Worth a look'],['pos','Positive value'],['today','Today'],['nocaution','Hide far-from-market']].map(([k,l])=>`<button class="${S.filter===k?'active':''}" data-f="${k}" role="tab" aria-selected="${S.filter===k}">${l}</button>`).join('')}</div><span class="count">${list.length} of ${GAMES.length} games</span></div><p class="legend"><b>How to read a card:</b> the top is the model's projected score and pick. Below it, Hard Rock Bet's best-priced side in each market. The green or red pill is the <b>value</b>: what the model expects you would make per $1 at that price. The bar underneath puts it in context: the dot is that value, the shaded band is the range when the same bet is re-checked 18 ways (five model versions, line moved 2 points either way), and the blue tick is the 2% floor. <b>Worth a look</b> means the whole band clears the floor. <b>Skip</b> means at least one check fell below it.</p><div class="grid">${list.map(g=>cardHtml(g,models[g.game_id])).join('')||'<p class="muted">No games match this filter.</p>'}</div><p class="foot">${srcNote} \u26A0 <b>Far from market</b> means the model and Hard Rock disagree by more than 5 points. When that has happened in past seasons the market was usually closer than the model, so treat that value as a flag to investigate, not a bet to make. Nothing here is a guaranteed edge; the model is a second opinion.</p>`;$('view').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;renderSlate()});$('view').querySelectorAll('.game').forEach(c=>{c.onclick=e=>{if(e.target.closest('a'))return;location.hash='#/game/'+encodeURIComponent(c.dataset.g)};c.onkeydown=e=>{if(e.key==='Enter')c.onclick(e)}})}
function cardHtml(g,m){const f=m.f;const flags=Object.values(g.review_flags||{}).flat().length;const fav=f.home_spread<0?g.home:f.home_spread>0?g.away:null;const bookHd=m.hr?bookLabel(m.hr):m.primary?`No Hard Rock quote \u00B7 ${bookLabel(m.primary)}`:'No Hard Rock quote';const rows=m.rows.map(r=>`<div class="edge"><div class="mk"><b>${esc(marketText(g,r.market,r.line))}</b><small>${esc(signed(r.odds,0))}${r.override?' \u00B7 manual':''}</small></div><div class="${evCls(r.ev)}">${esc(spct(r.ev))}</div><div class="vd">${badge(r.screen)}</div></div><div class="vrow">${valueBar(r.screen,r.ev)}${r.caution?`<div class="caution-line" title="${CAUTION_TEXT}">\u26A0 Far from market (${num(r.gap,0)} pts). Treat as a flag, not an edge.</div>`:''}</div>${r.elsewhere?`<div class="elsewhere">Better price at <b>${esc(bookLabel(r.elsewhere.book))} ${esc(marketText(g,r.elsewhere.market,r.elsewhere.line))} (${esc(signed(r.elsewhere.odds,0))})</b> ${esc(spct(r.elsewhere.ev))}</div>`:''}`).join('');return `<article class="card game" data-g="${esc(g.game_id)}" tabindex="0" role="link" aria-label="${esc(team(g.away).name)} at ${esc(team(g.home).name)}"><div class="when"><span>${esc(when(g.kickoff))}</span><span>${g.neutral?'Neutral site: ':''}${esc(g.venue||'')}</span></div><div class="teams">${chip(g.away)}<span class="nm">${esc(team(g.away).name)}<small>away</small></span><span class="sc">${num(f.away_score)}</span>${chip(g.home)}<span class="nm">${esc(team(g.home).name)}<small>${g.neutral?'designated home':'home'}</small></span><span class="sc">${num(f.home_score)}</span></div><div class="line-row"><span>${fav?`<b>${esc(fav)} by ${num(Math.abs(f.home_spread))}</b>`:'<b>Pick</b>'} <small>\u00B7 home ${esc(signed(f.home_spread))}</small></span><span><b>Total ${num(f.total)}</b></span></div><div class="bar"><span class="a" style="width:${f.away_win*100}%"></span><span class="t" style="width:${f.tie*100}%"></span><span class="h" style="width:${f.home_win*100}%"></span></div><div class="b const VLO=-30,VHI=45;const vpos=x=>Math.max(0,Math.min(100,((x*100)-VLO)/(VHI-VLO)*100));
function valueBar(s,ev,caption){const floor=(s?s.floor:(POLICY?POLICY.paper_ev_floor:.02));const lo=s?Math.min(s.worst.ev,ev):ev,hi=s?Math.max(s.best.ev,ev):ev;const ok=s&&s.decision==='Paper candidate';const cap=caption==null?(s?`<span>Worst case ${esc(spct(s.worst.ev))} across ${s.n} checks</span><span>Floor ${esc(spct(floor))}</span>`:'<span>No stress test for this game</span>'):caption;return `<div class="vbar" role="img" aria-label="Value ${esc(spct(ev))}; tested range ${esc(spct(lo))} to ${esc(spct(hi))}; floor ${esc(spct(floor))}"><span class="tick" style="left:${vpos(0)}%"></span><span class="tick floor" style="left:${vpos(floor)}%" title="Floor: value must stay above ${esc(spct(floor))} in every check"></span>${s?`<span class="band ${ok?'ok':''}" style="left:${vpos(lo)}%;width:${Math.max(0.8,vpos(hi)-vpos(lo))}%"></span>`:''}<span class="dot ${ev>0?'pos':ev<0?'neg':''}" style="left:${vpos(ev)}%"></span></div>${cap?`<div class="vcap">${cap}</div>`:''}`}

</div><div class="stat"><label>Likely total (80%)</label><b style="font-size:15px">${num(f.total_80[0],0)} to ${num(f.total_80[1],0)}</b></div></div><p class="explain">Negative line = home team favored. The ranges are where 8 of 10 outcomes should land. The win chances above are the model's view before any price. Using: ${esc(P.meta.versions.find(v=>v.id===S.version)?.label||'what-if scenario')}; quarterbacks from the ${esc((f.qbs.home.basis||'depth chart').toLowerCase())}.</p>${f.components?`<details><summary>How each of the five models sees it</summary><div class="tablewrap"><table><tr><th>Component</th><th>Home win*</th><th>Home spread</th><th>Total</th></tr>${Object.entries(f.components).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${pct(x.home_win/(1-x.tie))}</td><td>${esc(signed(x.home_spread))}</td><td>${num(x.total)}</td></tr>`).join('')}</table></div><p class="mini muted">*Excludes ties. Component range ${pct(f.component_win_probability_range[0])} to ${pct(f.component_win_probability_range[1])} home win.</p></details>`:''}${drivers?`<details><summary>What is driving the number</summary><p class="mini muted">Each row is how much one team stat pushes the projected margin, in points. Statistical contributions, not causes.</p><div class="drivers">${drivers}</div></details>`:''}${flags?`<details><summary>Things to double-check before betting</summary><ul class="flags">${flags}</ul></details>`:''}</div>

function calc(gid){const out=$('c-result');const inp=calcInputs();if(!inp){out.innerHTML='<p class="muted">Enter a line and odds, or tap a price above.</p>';return}const f=fc(S.version,gid)||fc(P.meta.default_version,gid);try{const x=compare(f,inp.m,inp.line,inp.odds);const fair=fairOdds(x.w,x.p);let html=`<div class="stats"><div class="stat ${x.ev>0?'pos':x.ev<0?'neg':''}"><label>Value per $1</label><b>${esc(spct(x.ev))}</b></div><div class="stat"><label>Chance it wins</label><b>${pct(x.w)}</b></div><div class="stat"><label>Chance of a push</label><b>${pct(x.p)}</b></div><div class="stat"><label>Win rate you need</label><b>${pct(x.breakeven)}</b></div><div class="stat"><label>Fair price</label><b>${fair==null?'n/a':esc(signed(Math.round(fair),0))}</b></div></div><p class="explain" style="margin:0 0 8px">Value is what the model expects you would make per $1 at this price (ties refunded). \u201CWin rate you need\u201D is the break-even at these odds; \u201CFair price\u201D is the odds the model thinks this side deserves.</p>`;const e=ensembleScreen(gid,inp.m,inp.line,inp.odds);if(e)html+=screenHtml(e,'Verdict','Re-checked with all five model versions and with the line moved '+e.stress+' points against you. Worth a look only if the value stayed positive every time.');if(S.version!==ENS){const s=selectionScreen(f,inp.m,inp.line,inp.odds,POLICY);html+=screenHtml(s,'Same test, this model only','The line-move test using just the model you have selected.')}out.innerHTML=html}catch(err){out.innerHTML=`<p class="muted">${esc(err.message)}</p>`}}

async function saveQuote(gid){try{if(!$('c-confirm').checked)throw Error('Tick the confirmation box first.');const inp=calcInputs();if(!inp)throw Error('Enter the line and odds.');if(S.version==='scenario')throw Error('Pick a saved model version to record a quote. Scenario results are not ledger forecasts.');const f=fc(S.version,gid);const ref=forecastRef(S.version,gid);if(!f||!ref)throw Error('No saved forecast for this model and game.');const obs=new Date($('c-observed').value);if(isNaN(obs))throw Error('Enter the observation time.');if(obs.getTime()>Date.now()+60000)throw Error('Observation time is in the future.');const g=GBY[gid];if(g.kickoff&&obs.getTime()>=new Date(g.kickoff).getTime())throw Error('Pregame quotes only: the observation time is after kickoff.');const bookKey=$('c-book').value;const comparison=comparisonDoc(f,inp.m,inp.line,inp.odds);const e=ensembleScreen(gid,inp.m,inp.line,inp.odds);const id=stampId('q');const doc={game_id:gid,home:g.home,away:g.away,version:S.version,forecast_seq:ref.seq,forecast_key:ref.key,forecast_issued_at:ref.issued_at,market:inp.m,line:inp.line,odds:inp.odds,book_key:bookKey,book_label:bookLabel(bookKey),observed_at:obs.toISOString(),quote_type:$('c-type').value,confirmed:true,source:'dashboard',comparison,ensemble_screen:e?{decision:e.decision,stress_min_ev:e.worst.ev,stress_max_ev:e.best.ev,american_price_at_stress_ev_floor:e.am}:null,kickoff:g.kickoff,season:P.meta.season,week:P.meta.week,payload_sha256:P.meta.payload_sha256,created_at:new Date().toISOString()};await writeDoc('quotes/'+id,doc);S.lastQuoteId=id;$('c-confirm').checked=false;$('b-line').value=inp.line;$('b-odds').value=inp.odds;$('c-savenote').textContent=S.db?'Saved to your journal.':'Saved on this device; it will sync when the journal connects.';toast(S.db?'Price saved to your journal.':'Preview mode: saved to this browser only.')}catch(err){toast(err.message,true)}}

function weatherEffect(params,temp,wind,roof){if(roof==='dome'||roof==='closed')return 0;if(roof!=='outdoors')throw Error('Confirm roof open/outdoors or closed before applying weather.');if(!Number.isFinite(temp)||!Number.isFinite(wind)||wind<0||wind>120||temp<-60||temp>140)throw Error('Invalid Fahrenheit temperature or mph wind.');const v=[Math.max(0,wind-10)/10,Math.max(0,40-temp)/20,Math.max(0,temp-85)/15];const c=params.coefficients;const e=v[0]*c[0]+v[1]*c[1]+v[2]*c[2];return Math.max(-8,Math.min(8,e))}
const meanOf=(support,pmf)=>support.reduce((a,x,i)=>a+x*pmf[i],0);
function tilt(support,pmf,target){/* exponential tilting p'(x) ~ p(x)exp(th x), solved for the target mean; keeps the support lattice, key-number spikes and push mass */const mu=meanOf(support,pmf);if(Math.abs(mu-target)<1e-9)return pmf.slice();const at=th=>{let z=0;const out=support.map((x,i)=>{const v=pmf[i]*Math.exp(th*(x-mu));z+=v;return v});return out.map(v=>v/z)};let lo=-2,hi=2;for(let k=0;k<80;k++){const mid=(lo+hi)/2;if(meanOf(support,at(mid))<target)lo=mid;else hi=mid}return at((lo+hi)/2)}
function tiltMix(support,pmf,delta,w){const t=tilt(support,pmf,meanOf(support,pmf)+delta);return {support:support.slice(),pmf:pmf.map((p,i)=>w*t[i]+(1-w)*p)}}
function quantiles(support,pmf,qs){let c=0,i=0;const out=[];for(const q of qs){while(i<support.length&&c+pmf[i]<q){c+=pmf[i];i++}out.push(support[Math.min(i,support.length-1)])}return out}
function summarize(ms,mp,ts,tp){let mean=0,win=0,tie=0;ms.forEach((x,i)=>{mean+=x*mp[i];if(x>0)win+=mp[i];else if(x===0)tie+=mp[i]});let tmean=0;ts.forEach((x,i)=>tmean+=x*tp[i]);const m80=quantiles(ms,mp,[.1,.9]),t80=quantiles(ts,tp,[.1,.9]);return {home_spread:-mean,total:tmean,home_win:win,tie,away_win:1-win-tie,margin_80:m80,total_80:t80,home_score:(tmean+mean)/2,away_score:(tmean-mean)/2,margin_support:ms,margin_pmf:mp,total_support:ts,total_pmf:tp}}

$('s-run').onclick=()=>{try{const p=Number($('s-prob').value)/100;if(!Number.isFinite(p)||p<0||p>1)throw Error('Probability must be 0 to 100%.');const src=$('s-src').value.trim();if(!src)throw Error('Add the source, or write "hypothetical".');let dm=0,dt=0;const changes=[];for(const [side,sign] of [['home',1],['away',-1]]){const sel=$(side==='home'?'s-hqb':'s-aqb').value;const baseId=f.qbs[side].id;if(sel&&sel!==baseId){const old=qbs.find(q=>q.team===g[side]&&q.player_id===baseId),nw=qbs.find(q=>q.team===g[side]&&q.player_id===sel);if(!old||!nw)throw Error('QB must be on the timestamped depth chart.');const d=nw.rating-old.rating;dm+=sign*d*coef.margin_per_rating;dt+=d*coef.total_per_rating;changes.push(side+' QB: '+old.name+' \u2192 '+nw.name+' (\u0394 rating '+signed(d,3)+')')}const pts=Number($(side==='home'?'s-hinj':'s-ainj').value||0);if(!Number.isFinite(pts)||Math.abs(pts)>15)throw Error('Manual team adjustment must be between -15 and +15 points.');if(pts){dm+=sign*pts;dt+=pts;changes.push(side+' non-QB '+signed(pts,2)+' pts')}}let wxe=0;if($('s-wx').checked){wxe=weatherEffect(P.scenario_inputs.weather_params,Number($('s-temp').value),Number($('s-wind').value),$('s-roof').value);dt+=wxe;changes.push('weather '+signed(wxe,2)+' total pts')}const m=tiltMix(f.margin_support,f.margin_pmf,dm,p),t=tiltMix(f.total_support,f.total_pmf,dt,p);const sum=summarize(m.support,m.pmf,t.support,t.pmf);const game={...sum,game_id:gid,home_team:g.home,away_team:g.away,qbs:f.qbs,drivers:[],version:baseV+'-scenario'};S.scenario={game_id:gid,base_version:baseV,game,detail:{weight:p,source:src,changes,margin_change:dm,total_change:dt,method_note:'exponential tilt to shifted mean',weather_effect:wxe,home_qb_id:$('s-hqb').value,away_qb_id:$('s-aqb').value,home_injury_points:Number($('s-hinj').value||0),away_injury_points:Number($('s-ainj').value||0)}};$('s-result').innerHTML=`<div class="teams">${chip(g.away)}<span class="nm">${esc(team(g.away).name)}</span><span class="sc">${num(sum.away_score)} <small class="muted">was ${num(f.away_score)}</small></span>${chip(g.home)}<span class="nm">${esc(team(g.home).name)}</span><span class="sc">${num(sum.home_score)} <small class="muted">was ${num(f.home_score)}</small></span></div><div class="stats"><div class="stat"><label>Home spread</label><b>${esc(signed(sum.home_spread))}</b><small> was ${esc(signed(f.home_spread))}</small></div><div class="stat"><label>Total</label><b>${num(sum.total)}</b><small> was ${num(f.total)}</small></div><div class="stat"><label>${esc(g.home)} win</label><b>${pct(sum.home_win)}</b><small> was ${pct(f.home_win)}</small></div><div class="stat"><label>Tie</label><b>${pct(sum.tie)}</b></div></div><p class="mini">Shift applied: margin ${esc(signed(dm,2))}, total ${esc(signed(dt,2))}, weighted at ${pct(p)} likelihood against the unchanged projection.</p><p class="mini muted">80% margin ${num(sum.margin_80[0],0)} to ${num(sum.margin_80[1],0)} \u00B7 80% total ${num(sum.total_80[0],0)} to ${num(sum.total_80[1],0)}</p><ul class="flags">${changes.map(c=>`<li>${esc(c)}</li>`).join('')||'<li>No changes from the base forecast.</li>'}</ul><p class="mini muted">Quick estimate. The quarterback effect comes from the model's own coefficients; the injury points are your guess.</p><button id="s-use">Price this scenario</button>`;$('s-save').disabled=false;$('s-use').onclick=()=>{S.version='scenario';renderHeader();location.hash='#/game/'+encodeURIComponent(gid)};renderHeader();toast('Scenario ready. Pick \u201CWhat-if scenario\u201D in the model menu to price it.')}catch(err){toast(err.message,true)}};

function parityTest(){const rows=P.evidence?.parity||[];let n=0;const eq=(a,b)=>(a==null&&b==null)||(a!=null&&b!=null&&Math.abs(a-b)<=1e-9);for(const r of rows){const g=P.forecasts[r.version]?.[r.game_id];if(!g)continue;let s;try{s=selectionScreen(g,r.market,r.line,r.odds,POLICY)}catch(e){console.error('parity: threw on',r,e);return}const got={win_probability:s.base.w,push_probability:s.base.p,expected_return_per_dollar:s.base.ev,stress_min_ev:s.worst.ev,stress_max_ev:s.best.ev,minimum_decimal_price_for_stress_ev_floor:s.minDec,american_price_at_stress_ev_floor:s.am,decision:s.decision};for(const k of Object.keys(got)){const ok=k==='decision'?got[k]===r[k]:eq(got[k],r[k]);if(!ok){console.error('parity mismatch',{row:r,field:k,page:got[k],python:r[k]});return}}n++}console.log('parity ok n='+n)}
